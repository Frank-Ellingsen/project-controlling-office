version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. Deterministic Calculation Engine & Multi-Agent API (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: elkem_controller_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - KUNNSKAPSBASERE_PATH=/app/data/kunnskapsbase
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # --- API Keys ---
      - MINI_API_KEY=${MINI_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # --- Ollama & Model Configuration ---
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-ollama}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Direct mount of Google Drive Kunnskapsbase (Read-Only)
      - "G:/My Drive/Elkem:/app/data/kunnskapsbase:ro"
      # Persist DuckDB database, sample data and audit logs
      - ./data:/app/data
    depends_on:
      - qdrant
    networks:
      - controller_net

  # ---------------------------------------------------------------------------
  # 2. UI / UX Dashboard (Streamlit with HITL Approval Tollbooth)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: elkem_controller_frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - controller_net

  # ---------------------------------------------------------------------------
  # 3. Vector Database for RAG (Qdrant)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: elkem_controller_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - controller_net

networks:
  controller_net:
    driver: bridge

volumes:
  qdrant_storage:
